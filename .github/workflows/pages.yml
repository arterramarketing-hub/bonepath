name: Deploy Bonepath to Pages

on:
  push:
    # main only, deliberately. This once also answered to
    # claude/dark-souls-mobile-poc-xnquc4, and that is exactly how a stray
    # push went unnoticed: the deploy kept succeeding from a branch nobody
    # meant to be live while main fell behind, and a push to the dead name
    # would have published its contents over the site. If a session pushes
    # somewhere else now, the site simply stops updating — loudly, which is
    # the point. Do not add a second branch here.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
