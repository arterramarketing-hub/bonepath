name: Deploy Bonepath to Pages

on:
  push:
    # main only, deliberately. This once also answered to
    # claude/dark-souls-mobile-poc-xnquc4, and that is exactly how a stray
    # push went unnoticed: the deploy kept succeeding from a branch nobody
    # meant to be live while main fell behind, and a push to the dead name
    # would have published its contents over the site. If a session pushes
    # somewhere else now, the site simply stops updating — loudly, which is
    # the point. Do not add a second branch here.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # THE BUILD STAMP: main's commit count and date go into index.html's
      # `const BP_BUILD='dev',BP_BUILT='';` line, which the title's check for
      # updates compares. It fails the deploy if the line is not there.
      - name: Stamp the build
        run: |
          N=$(git rev-list --count HEAD)
          D=$(git log -1 --format=%cd --date=format:'%-d %b %Y')
          grep -q "const BP_BUILD='dev',BP_BUILT='';" index.html
          sed -i "s/const BP_BUILD='dev',BP_BUILT='';/const BP_BUILD='$N',BP_BUILT='$D';/" index.html
          grep -q "const BP_BUILD='$N'" index.html
          echo "stamped v$(grep -o "BP_MAJOR='[^']*'" index.html | cut -d"'" -f2).$N ($D)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
